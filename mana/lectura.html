<body class="reading-mode">
    <div class="overlay-texture"></div>

    <nav class="reading-nav">
        <a href="index.html" class="back-btn" id="link-volver"><i class="fas fa-arrow-left"></i> Volver</a>
    </nav>

    <!-- Reading progress bar at the very top of the page -->
    <div class="reading-progress-container">
        <div id="reading-progress" class="reading-progress-bar"></div>
    </div>

    <!-- Main Content Pergamino Container -->
    <main id="lectura-content" class="fade-in">
        <div class="loader-gold">Abriendo el Códice...</div>
    </main>

    <!-- Floating Audio Control Panel (Premium Zen) -->

        <div class="audio-controls-row">

                <i class="fas fa-spa audio-pulse-icon" id="audio-pulse"></i>
                <div class="audio-meta-text">
                    <div class="audio-title" id="audio-track-title">Música Contemplativa</div>
                    <div class="audio-status" id="audio-track-status">Sintonía de fondo para tu estudio</div>
                </div>
            </div>
            <div class="audio-buttons">
                <!-- Play/Pause Button -->
                <button id="btn-play-pause" class="btn-audio-main" title="Reproducir / Pausar Música" aria-label="Reproducir / Pausar Música">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Audio elements (background music is contemplative, loaded from a free repository/ecosystem) -->
    <audio id="audio-bg-music" loop preload="auto">
        <!-- Contemplative instrumental ambient music track (Erik Satie Gymnopedie No. 1) -->
