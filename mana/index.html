<body>
    <div class="overlay-texture"></div>

    <nav class="top-nav">
        <div class="brand">
            <span class="icon-book">🍞</span>
            <div class="titles">
                <h1 class="cinzel-font">MANÁ <span class="gold-text">VISUAL</span></h1>
                <p class="tagline-new">Tu Biblia completa en un año</p>
            </div>
        </div>
    </nav>

    <header class="hero-mana" id="hero-background-active">
        <div class="hero-blur-container">
            <div class="hero-date" id="hero-date-label">LUNES, 22 DE JUNIO</div>
            <div class="hero-day-number" id="hero-day-num">22</div>
            <div class="hero-month" id="hero-month-label">JUNIO</div>
            <div class="hero-verse" id="hero-verse-box">
                "No solo de pan vivirá el hombre, sino de toda palabra que sale de la boca de Dios."
                <br><small>Mateo 4:4</small>
            </div>
        </div>
    </header>

    <div class="days-bar-container">
        <div class="days-bar" id="days-slider">
            <!-- Inyectado dinámicamente por app.js -->
        </div>
    </div>

    <section class="search-container">
        <div class="search-box" id="abrir-calendario">
            <i class="fas fa-calendar-alt" style="color: var(--gold)"></i>
            <span class="search-label cinzel-font">Otras Fechas</span>
            <input type="date" id="fecha-buscada" class="input-mana">
        </div>
    </section>

    <main id="app-launcher" class="container-cards">
        <div class="skeleton-loader">Buscando la provisión de hoy...</div>
    </main>

    <!-- Scripts de integración del ecosistema y control global -->
    <script src="js/app.js" type="module"></script>
    <script src="../js/ecosistema-hub.js"></script>
    <script src="../js/global-hub.js" type="module"></script>
    <script src="../js/global-footer.js"></script>
