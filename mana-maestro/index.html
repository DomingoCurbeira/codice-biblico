<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maná Maestro | Sintonía Diaria</title>

    <!-- Estilos y Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;600;800&family=Merriweather:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="maestro-overlay"></div>

    <!-- Cabecera Hero -->
    <header class="maestro-hero" id="hero-bg">
        <div class="hero-content">
            <div class="maestro-badge">PROVISIÓN MAESTRA</div>
            <h1 class="maestro-fecha" id="display-fecha">21 de Mayo</h1>
            <h2 class="maestro-titulo-dia" id="display-titulo-dia">La Arquitectura del Sustento</h2>
        </div>
    </header>

    <main class="maestro-container">
        
        <!-- LLAVE MAESTRA -->
        <section class="llave-maestra-box">
            <div class="llave-icon">🔑</div>
            <h3 id="display-llave-titulo">Sintonía antes que Provisión</h3>
            <p id="display-llave-texto">Cargando revelación...</p>
        </section>

        <!-- EL DÍPTICO -->
        <div class="diptico-grid">
            <article class="porcion-card antiguo">
                <div class="porcion-header">
                    <span class="porcion-tag">📜 Antiguo Testamento</span>
                    <h4 id="at-referencia">Cargando...</h4>
                </div>
                <div class="porcion-body">
                    <h5 id="at-titulo">...</h5>
                    <p id="at-misterio">...</p>
                </div>
            </article>

            <article class="porcion-card nuevo">
                <div class="porcion-header">
                    <span class="porcion-tag">✝️ Nuevo Testamento</span>
                    <h4 id="nt-referencia">Cargando...</h4>
                </div>
                <div class="porcion-body">
                    <h5 id="nt-titulo">...</h5>
                    <p id="nt-misterio">...</p>
                </div>
            </article>
        </div>

        <!-- HERENCIA -->
        <section class="herencia-section">
            <h3 class="section-label">Tu Herencia en la Mano</h3>
            <div class="herencia-grid" id="herencia-container"></div>
        </section>

        <!-- DECRETO -->
        <section class="decreto-final">
            <div class="decreto-inner">
                <span class="decreto-label">Decreto de Maestría</span>
                <p id="display-decreto">...</p>
            </div>
        </section>
    </main>

    <!-- Navegación de Calendario (Cápsula de Mando) -->
    <nav class="maestro-nav">
        <button class="nav-btn" onclick="cambiarDia(-1)"><i class="fas fa-chevron-left"></i></button>
        
        <!-- Contenedor del Calendario con Sensor de Cristal -->
        <div class="nav-btn calendar-trigger" id="trigger-calendario">
            <i class="far fa-calendar-alt"></i> <span>Calendario</span>
            <input type="date" id="sensor-fecha" class="cristal-picker" onchange="seleccionarFecha(this.value)">
        </div>

        <button class="nav-btn" onclick="cambiarDia(1)"><i class="fas fa-chevron-right"></i></button>
    </nav>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="../js/ecosistema-hub.js"></script>
    <script src="../js/global-footer.js"></script>
</body>
</html>
