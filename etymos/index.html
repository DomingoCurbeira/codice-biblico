<body>

    <header class="etymos-hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-badge" id="hero-lang-badge">TESORO LINGÜÍSTICO</div>
            <h1 class="hero-title" id="hero-word-original">ETYMOS</h1>
            <p class="hero-translit" id="hero-word-translit">Descifrando la Verdad</p>
            <h2 class="hero-meaning" id="hero-word-spanish">Raíces de Sabiduría</h2>

                <button class="btn-filtro activo" data-idioma="todos">Todos</button>
                <button class="btn-filtro" data-idioma="hebreo">Hebreo</button>
                <button class="btn-filtro" data-idioma="griego">Griego</button>
                <button class="btn-filtro" data-idioma="arameo">Arameo</button>
            </div>
        </section>

        </div>
