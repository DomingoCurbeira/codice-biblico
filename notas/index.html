    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escriba | Diario de Revelaciones</title>

    <meta name="theme-color" content="#0a0c10">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="/img/escriba-192.png"> 
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">

<body>

    <div class="app-container">

        <aside id="sidebar" class="sidebar">
            <header class="sidebar-header">
                <h2>Escriba</h2>
                <!-- El botón de nueva nota ahora es un FAB al final -->
            </header>

            <div class="search-box">
                <input type="text" id="buscador" placeholder="Buscar en el diario..." autocomplete="off">
            </div>

            <div id="lista-notas" class="notes-list">
                <!-- Inyectado por JS -->
            </div>

            <div class="backup-controls" style="padding: 20px; display: flex; gap: 15px; border-top: 1px solid rgba(212, 180, 131, 0.1); background: rgba(0,0,0,0.2);">
                <button id="btn-download" class="btn-icon" title="Copia de seguridad" style="background: rgba(255,255,255,0.05); color: var(--accent);">
                    <i class="fas fa-download"></i>
                </button>
                <label for="file-upload" class="btn-icon" title="Restaurar registros" style="cursor: pointer; background: rgba(255,255,255,0.05); color: var(--accent);">
                    <i class="fas fa-upload"></i>
                </label>
                <input type="file" id="file-upload" accept=".json" style="display: none;">
            </div>
        </aside>

        <main id="editor-panel" class="editor-panel">
            
            <div id="empty-state" class="empty-state">
                <div class="empty-content">
                    <span>🪶</span>
                    <h2 class="cinzel-font">El Cofre de Recuerdos</h2>
                    <p>Cada palabra guardada es un paso más en tu camino de fe. Selecciona una reflexión o crea una nueva para continuar.</p>
                </div>
            </div>

            <header class="editor-header">
                <div class="editor-controls-left">
                    <button id="btn-volver" class="btn-icon" aria-label="Volver" title="Cerrar nota">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    
                    <div class="editor-actions">
                        <button id="btn-share-nota" class="btn-icon" title="Compartir Revelación" style="color: var(--accent);">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <button id="btn-borrar" class="btn-icon danger" title="Archivar permanentemente">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
                
                <div class="meta-info">
                    <span id="editor-date">Sintonizando el espíritu...</span>
                </div>
            </header>

            <div class="editor-content">
                <input type="text" id="nota-titulo" placeholder="Título de la Revelación" autocomplete="off">
                <textarea id="nota-cuerpo" placeholder="Escribe aquí lo que el Espíritu ponga en tu corazón..."></textarea>
            </div>

        </main>

        <!-- BOTÓN FLOTANTE NUEVA NOTA (FAB) -->
        <button id="btn-nueva" class="fab-nueva" aria-label="Nueva Nota" title="Nueva Entrada">
            <i class="fas fa-plus"></i>
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
    <script src="../js/ecosistema-hub.js"></script>
    <script src="../js/global-hub.js"></script>
    <script src="../js/global-footer.js"></script>
</body>
</html>
